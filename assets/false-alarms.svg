<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 234" width="760" height="234" role="img" aria-label="Two identical agents. How often is one crowned the winner?"><rect x="0.5" y="0.5" width="759" height="233" rx="12" fill="#ffffff" stroke="#d1d9e0"/><text x="28" y="40" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#1f2328">Two identical agents. How often is one crowned the winner?</text><text x="28" y="64" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#59636e">Simulated: 500 comparisons, 30 tasks of varying difficulty, 3 attempts each.</text><text x="28" y="114" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#1f2328">Eyeballing: “more than 10 points apart”</text><rect x="300" y="97" width="318.8" height="26" rx="5" fill="#cf222e"/><text x="628.8" y="115" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#1f2328">11.2%</text><text x="28" y="158" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#1f2328" font-weight="600">homefield v2 verdict</text><rect x="300" y="141" width="62.6" height="26" rx="5" fill="#1a7f37"/><text x="372.6" y="159" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#1f2328">2.2%</text><text x="28" y="212" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#59636e">Any “winner” here is a false alarm. The verdict keeps it under 5%.</text></svg>
